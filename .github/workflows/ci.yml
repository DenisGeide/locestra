name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test:
    name: Windows reference host
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run public routing and gateway contract tests
        run: uv run pytest -q tests/test_evalkit.py tests/test_routing_eval.py tests/test_gateway_contracts.py

      - name: Run routing regression gate
        run: uv run python -m evals.routing --output-dir .artifacts/evalkit --fail-under-exact 1

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locestra-routing-evaluation
          path: .artifacts/evalkit
          if-no-files-found: warn

  evalkit-portability:
    name: EvalKit portability
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run portable EvalKit tests
        run: uv run pytest -q tests/test_evalkit.py tests/test_routing_eval.py

      - name: Run routing regression gate
        run: uv run python -m evals.routing --no-write --fail-under-exact 1
