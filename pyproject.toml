[project]
name = "locestra"
version = "0.1.0"
description = "Local-first AI orchestration for software development"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "faster-whisper>=1.2",
  "httpx>=0.28",
  "pydantic>=2.13,<3",
  "psutil>=7.0",
  "python-dotenv>=1.1",
  "python-multipart>=0.0.20",
  "python-telegram-bot>=22.0",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
